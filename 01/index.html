<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>demo - Project Timeline</title>
    <link rel="stylesheet" href="../common/css/base.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>Project Timeline</h1>
      <p class="lead-text">月と工程の見出しを表示したまま、スケジュールを縦横にスクロールできます。</p>

      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th scope="col">工程</th>
              <th scope="col">詳細項目</th>
              <th scope="col">4月</th>
              <th scope="col">5月</th>
              <th scope="col">6月</th>
              <th scope="col">7月</th>
              <th scope="col">8月</th>
              <th scope="col">9月</th>
              <th scope="col">10月</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="rowgroup" rowspan="2">企画</th>
              <th scope="row">企画立案</th>
              <td><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">課題・目的整理</th>
              <td colspan="2"><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td><td></td>
            </tr>
          </tbody>
          <tbody>
            <tr>
              <th scope="rowgroup" rowspan="4">要件</th>
              <th scope="row">現状調査</th>
              <td><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">関係者ヒアリング</th>
              <td colspan="2"><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">要件定義</th>
              <td></td>
              <td colspan="2"><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">要件レビュー</th>
              <td></td><td></td>
              <td><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td>
            </tr>
          </tbody>
          <tbody>
            <tr>
              <th scope="rowgroup" rowspan="4">設計</th>
              <th scope="row">情報設計</th>
              <td></td>
              <td><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">画面設計</th>
              <td></td>
              <td colspan="2"><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">UIデザイン</th>
              <td></td><td></td>
              <td colspan="2"><span class="bar"></span></td>
              <td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">API設計</th>
              <td></td><td></td>
              <td colspan="2"><span class="bar"></span></td>
              <td></td><td></td><td></td>
            </tr>
          </tbody>
          <tbody>
            <tr>
              <th scope="rowgroup" rowspan="5">実装</th>
              <th scope="row">開発環境構築</th>
              <td></td><td></td>
              <td><span class="bar"></span></td>
              <td></td><td></td><td></td><td></td>
            </tr>
            <tr>
              <th scope="row">フロントエンド実装</th>
              <td></td><td></td><td></td>
              <td colspan="2"><span class="bar"></span></td>
              <td></td><td></td>
            </tr>
            <tr>
              <th scope="row">API実装</th>
              <td></td><td></td><td></td>
              <td colspan="3"><span class="bar"></span></td>
              <td></td>

            <tr>

              <td></td><td></td><td></td><td></td>
              <td colspan="2"><span class="bar"></span></td>
              <td></td>
            </tr>
            <tr>
              <th scope="row">コードレビュー</th>
              <td></td><td></td><td></td><td></td><td></td>
              <td><span class="bar"></span></td>
              <td></td>
            </tr>
          </tbody>

            <tr>

              <td></td><td></td><td></td><td></td><td></td><td></td>
              <td><span class="bar"></span></td>
            </tr>
          </tbody>
          <tbody>
            <tr>
              <th scope="rowgroup" rowspan="3">リリース</th>

            <tr>

              <td></td><td></td><td></td><td></td><td></td><td></td>
              <td><span class="bar"></span></td>

              <td></td><td></td><td></td><td></td><td></td><td></td>

</html>
